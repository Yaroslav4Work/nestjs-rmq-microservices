services:
  postgres:
    hostname: postgres
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    hostname: rabbitmq
    restart: unless-stopped
    image: rabbitmq:3-management
    ports:
      - "5672:5672" # App traffic
      - "15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=password123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    hostname: redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  time-service:
    build:
      context: ./time-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://myuser:mysecretpassword@postgres:5432/time_service
      RABBITMQ_URL: amqp://admin:password123@rabbitmq:5672
      RABBITMQ_QUEUE: time.events.queue
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3001:3001"

  telegram-gateway:
    build:
      context: ./telegram-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://myuser:mysecretpassword@postgres:5432/telegram_gateway
      RABBITMQ_URL: amqp://admin:password123@rabbitmq:5672
      RABBITMQ_QUEUE: time.events.queue
      RABBITMQ_DLQ_QUEUE: time.events.dlq
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    ports:
      - "3000:3000"

volumes:
  pg_data:
  rabbitmq_data:
  redis_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
